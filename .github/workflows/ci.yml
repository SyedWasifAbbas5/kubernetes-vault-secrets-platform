name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -v

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t vault-platform-app:${{ github.sha }} .

  security:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build -t vault-platform-app:scan .

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: vault-platform-app:scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  manifests:
    name: Kubernetes Manifest Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Kustomize build
        run: |
          kubectl kustomize k8s/security > /tmp/security.yaml

      - name: Validate Kubernetes manifests
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            garethr/kubeval:latest \
            /workspace/k8s/security/network-policy.yaml \
            /workspace/k8s/security/rbac.yaml \
            --strict \
            --ignore-missing-schemas
