apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-app
  namespace: production
---
# Explicitly deny application-level Kubernetes API permissions.
# The ServiceAccount is used by Vault Kubernetes authentication.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault-app-no-access
  namespace: production
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vault-app-no-access
  namespace: production
subjects:
  - kind: ServiceAccount
    name: vault-app
    namespace: production
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vault-app-no-access
